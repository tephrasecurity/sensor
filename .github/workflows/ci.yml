name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.4 && python -m pytest -q tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm ci && npm run build
      - name: dist/ matches src/
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            git diff --stat dist; echo "::error::dist/ is out of date. Run npm run build and commit it."; exit 1
          fi

  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./
        with:
          artifact-name: self-test
      - run: curl -sS -o /dev/null https://api.github.com && getent hosts example.com

  self-test-check:
    needs: self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: self-test-*
          merge-multiple: true
      - name: the sensor recorded the job
        run: |
          python3 - summary.json <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          names = {x.get("domain") for x in r["records"]}
          assert "api.github.com" in names and "example.com" in names, names
          print(len(r["records"]), "records OK")
          PY
